[package]
name = "trth-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
truthlinked-core = { path = "../truthlinked/crates/truthlinked-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
hex = "0.4"
postcard = { version = "1.1", features = ["alloc"] }
fips204 = { version = "0.4", features = ["ml-dsa-65"] }
rpassword = "7.3"
dirs = "5.0"
rand = "0.8"
regex = "1.10"
bip39 = "2.2.2"
include_dir = "0.7"
toml = "0.8"
urlencoding = "2.1"
